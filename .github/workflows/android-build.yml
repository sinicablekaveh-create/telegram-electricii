name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Alpha APK
        run: |
          echo "Telegram Electric Alpha build"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper pending"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-electric-alpha-apk
          path: app/build/outputs/apk/debug/*.apk
