plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinicablekaveh.thereeibaru'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sinicablekaveh.thereeibaru.v2'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
