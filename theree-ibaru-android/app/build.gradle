plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinicablekaveh.thereeibaru'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sinicablekaveh.thereeibaru.v3'
        minSdk 26
        targetSdk 36
        versionCode 30
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
